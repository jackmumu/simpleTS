<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浮动布局</title>
    <style>
        .container {
            width: 100%;
        }
        .sidebar {
            float: left;
            width: 25%;
            background-color: #d0d0d0;
        }
        .main {
            float: left;
            width: 75%;
            background-color: #f0f0f0;
        }
        .clearfix::after {
            content: "";
            display: table;
            clear: both;
        }
    </style>
</head>
<body>
    <div class="container clearfix">
        <div class="sidebar">侧边栏</div>
        <div class="main">主要内容</div>
    </div>
</body>
</html>
